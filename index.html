<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR体験 - 恐竜マーカー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .description {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-wrapper {
            width: 100%;
        }

        .status-text {
            font-size: 15px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 12px;
            border-radius: 6px;
            margin-top: 12px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            transition: width 0.1s ease;
        }

        #percent-text {
            font-weight: bold;
            color: #764ba2;
            font-size: 18px;
        }

        #ar-button {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            width: 100%;
            margin-bottom: 10px;
        }

        #ar-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .info-text {
            font-size: 14px;
            color: #999;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🦕 AR恐竜図鑑 🦖</h1>
        
        <p class="description">
            快適にARを体験するために、裏で恐竜の3Dデータを先読みしています。しばらくお待ちください...
        </p>

        <div class="status">
            <div class="status-wrapper">
                <div class="status-text">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="spinner" id="loading-spinner"></span>
                        <span id="status-message">ダウンロードの準備中...</span>
                    </div>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>

        <button id="ar-button">
            🎬 AR体験を開始
        </button>

        <p class="info-text">
            ※ カメラへのアクセスを許可してください。<br>
            ※ ダウンロード完了後、自動的にAR画面に移動します。
        </p>
    </div>

    <script>
        // 事前に読み込む4つの3Dモデルファイル
        const modelUrls = [
            'models/プロトケラトプス/Protoceratops.glb',
            'models/ラウジャア/Ravjaa.glb',
            'models/コリトサウルス/Corythosaurus.glb',
            'models/サヴァケファレ/Zavacephale.glb'
        ];

        const statusMessage = document.getElementById('status-message');
        const percentText = document.getElementById('percent-text');
        const progressBar = document.getElementById('progress-bar');
        const arButton = document.getElementById('ar-button');
        const spinner = document.getElementById('loading-spinner');

        async function preloadModels() {
            const totalFiles = modelUrls.length;
            let completedFiles = 0;

            for (let i = 0; i < totalFiles; i++) {
                const url = modelUrls[i];
                const fileName = url.substring(url.lastIndexOf('/') + 1);

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    // サーバーからファイルサイズを取得
                    const contentLength = response.headers.get('content-length');
                    
                    // ⭕【修正ポイント】容量が取得できないサーバー環境に備え、仮のサイズ（3MB=3000000バイト）をセット
                    const total = contentLength ? parseInt(contentLength, 10) : 3000000;
                    const isEstimated = !contentLength; // サーバーからサイズが取れなかったかどうかのフラグ
                    
                    const reader = response.body.getReader();
                    let loaded = 0;

                    // ストリーミングでリアルタイムに進捗を取得
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        loaded += value.length;

                        // 現在ダウンロード中のファイルの進捗率 (0 〜 1)
                        let fileProgress = loaded / total;
                        
                        // もしサイズが推測値で、実際のデータが推測を超えそうな場合は99%で待機させる
                        if (isEstimated && fileProgress > 0.99) {
                            fileProgress = 0.99;
                        }

                        // 4つのファイル全体の合計進捗率を計算 (0 〜 100)
                        let overallProgress = ((completedFiles + fileProgress) / totalFiles) * 100;
                        
                        // 完全にファイル処理が終わるまではそのファイル枠の最高値未満で留める
                        updateUI(Math.min(overallProgress, ((completedFiles + 0.99) / totalFiles) * 100), `データを読み込み中: ${fileName}`);
                    }

                    // 1つのファイルが完全にダウンロード完了したら確実に進捗を同期（1つ目なら25%、2つ目なら50%...）
                    completedFiles++;
                    const currentProgress = (completedFiles / totalFiles) * 100;
                    updateUI(currentProgress, `データを読み込み中: ${fileName}`);

                } catch (error) {
                    console.error(`ダウンロード失敗: ${url}`, error);
                    // 万が一エラーが起きても全体を止めず、完了扱いにして次のファイルに進む
                    completedFiles++;
                    updateUI((completedFiles / totalFiles) * 100, `一部データの読み込みをスキップしました`);
                }
            }

            // すべてのファイルのダウンロードが100%完了
            updateUI(100, 'すべての準備が完了しました！移動します...');
            if (spinner) spinner.style.display = 'none';
            arButton.style.display = 'block';

            // 1秒後に自動的にAR.htmlへ移動
            setTimeout(() => {
                window.location.href = 'AR.html';
            }, 1000);
        }

        // UI（プログレスバーとテキスト）を更新する補助関数
        function updateUI(percent, message) {
            const roundedPercent = Math.floor(percent);
            progressBar.style.width = `${percent}%`;
            percentText.textContent = `${roundedPercent}%`;
            statusMessage.textContent = message;
        }

        // ボタンを手動で押しても即座に遷移できるように設定
        arButton.addEventListener('click', () => {
            window.location.href = 'AR.html';
        });

        // ページが読み込まれたら即座に事前ダウンロードを開始
        window.addEventListener('DOMContentLoaded', preloadModels);
    </script>
</body>
</html>
