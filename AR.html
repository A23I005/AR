<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR体験 - 恐竜マーカー</title>
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        /* UIのスタイル（既存のものに合わせて調整） */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        #ar-container { visibility: hidden; }
        #collect-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background: #ff5722; color: white; border: none; border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; display: none;
        }
    </style>

    <script type="module">
        // Firebaseの設定と初期化
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6sOyrSwjY7fZaPEGDvn0iormTPWhjQsY",
            authDomain: "ar-stamp-6d9ed.firebaseapp.com",
            projectId: "ar-stamp-6d9ed",
            storageBucket: "ar-stamp-6d9ed.firebasestorage.app",
            messagingSenderId: "2..." // ※実際のIDが入ります
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            if (user) currentUser = user;
        });
        signInAnonymously(auth).catch(console.error);

        // 「図鑑に登録する」ボタンの処理
        document.getElementById('collect-btn').addEventListener('click', async () => {
            if (!currentUser || !window.activeMarkerId) return;
            try {
                await setDoc(doc(db, "users", currentUser.uid, "collection", window.activeMarkerId), {
                    collectedAt: new Date()
                });
                alert('図鑑に登録しました！');
            } catch (e) {
                console.error("Error adding document: ", e);
                alert('登録に失敗しました。');
            }
        });
    </script>
</head>
<body>

    <div id="start-screen">
        <h2>ARカメラを起動中...</h2>
        <p>マーカーをカメラに映してください</p>
    </div>

    <button id="collect-btn">図鑑に登録する</button>

    <div id="ar-container">
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; exposure: 1.2;" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;">
            
            <a-entity light="type: ambient; color: #BBB; intensity: 1.5"></a-entity>
            <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

            <a-marker type="pattern" url="markers/pattern-stanp1.patt" id="Protoceratops">
                <a-entity swipe-rotate><a-entity rotation="0 0 0">
                    <a-entity id="model-Protoceratops" scale="1 1 1" auto-center></a-entity>
                </a-entity></a-entity>
            </a-marker>

            <a-marker type="pattern" url="markers/pattern-stanp2.patt" id="Ravjaa">
                <a-entity swipe-rotate><a-entity rotation="0 0 0">
                    <a-entity id="model-Ravjaa" scale="1 1 1" auto-center></a-entity>
                </a-entity></a-entity>
            </a-marker>

            <a-marker type="pattern" url="markers/pattern-stanp3.patt" id="Corythosaurus">
                <a-entity swipe-rotate><a-entity rotation="0 0 0">
                    <a-entity id="model-Corythosaurus" scale="0.4 0.4 0.4" auto-center animation-mixer></a-entity>
                </a-entity></a-entity>
            </a-marker>

            <a-marker type="pattern" url="markers/pattern-stanp4.patt" id="Zavacephale">
                <a-entity swipe-rotate><a-entity rotation="0 0 0">
                    <a-entity id="model-Zavacephale" scale="0.07 0.07 0.07" auto-center></a-entity>
                </a-entity></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <script>
        // 各マーカーIDに対応する3Dモデルのパス（Draco圧縮済みのもの）
        const modelPaths = {
            'Protoceratops': 'models/プロトケラトプス/Protoceratops.glb',
            'Ravjaa': 'models/ラウジャア/Ravjaa.glb',
            'Corythosaurus': 'models/コリトサウルス/Corythosaurus.glb',
            'Zavacephale': 'models/サヴァケファレ/Zavacephale.glb'
        };

        window.activeMarkerId = null;

        const markers = document.querySelectorAll('a-marker');
        const collectBtn = document.getElementById('collect-btn');

        // マーカーを検知したときの処理
        markers.forEach((marker) => {
            marker.addEventListener('markerFound', () => {
                window.activeMarkerId = marker.id;
                collectBtn.style.display = 'block';

                // 【重要】ここで初めて3Dモデルを読み込む（遅延読み込み）
                const targetModel = document.getElementById('model-' + marker.id);
                if (targetModel && !targetModel.hasAttribute('gltf-model')) {
                    console.log(marker.id + " のモデルを読み込み・解凍します...");
                    targetModel.setAttribute('gltf-model', modelPaths[marker.id]);
                }
            });

            // マーカーを見失ったときの処理
            marker.addEventListener('markerLost', () => {
                if (window.activeMarkerId === marker.id) {
                    window.activeMarkerId = null;
                }
                collectBtn.style.display = 'none';
            });
        });

        // ページ読み込み完了時の処理
        window.addEventListener('load', () => {
            // ローディング画面を数秒後に消し、ARコンテナを表示する
            const startScreen = document.getElementById('start-screen');
            const arContainer = document.getElementById('ar-container');
            
            if (startScreen) {
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    if (arContainer) arContainer.style.visibility = 'visible';
                }, 500);
            }
        });
    </script>
</body>
</html>
